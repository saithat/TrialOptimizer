[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trial-optimizer"
version = "0.1.0"
description = "Evidence-first clinical trial intelligence database and ingestion tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
trialopt = "trial_optimizer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trial_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
